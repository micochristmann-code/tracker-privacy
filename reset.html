<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Neues Passwort – Tracker</title>
  <style>
    :root { --bg:#FAFAF8; --text:#0D0D0D; --muted:#6b6b6b; --line:#e6e6e2; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.65; padding: 0 20px;
    }
    .wrap { max-width: 440px; margin: 0 auto; padding: 56px 0 80px; }
    h1 { font-size: 30px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
    p { font-size: 16px; }
    a { color: #4a7000; }
    .box { border: 1px solid var(--line); border-radius: 14px; padding: 20px; background: #fff; }
    .foot { color: var(--muted); font-size: 13px; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Neues Passwort</h1>
    <p class="sub">App „Tracker"</p>

    <div class="box">
      <p style="margin:0"><strong>Dieser Link ist veraltet</strong><br>
      Fordere in der App unter <em>Anmelden → Passwort vergessen?</em> einen
      neuen Link an. Er kommt per E-Mail und führt dich direkt zum neuen
      Passwort.</p>
    </div>

    <p class="foot"><a href="datenschutz">Datenschutz</a> · <a href="impressum">Impressum</a></p>
  </div>
</body>
</html>
